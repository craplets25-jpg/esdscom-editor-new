services:
  postgres:
    image: postgres:16-alpine
    container_name: esdscom-editor-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: esdscom
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d esdscom"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - esdscom_postgres_data:/var/lib/postgresql/data

volumes:
  esdscom_postgres_data:
